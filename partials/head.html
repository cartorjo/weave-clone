<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <!-- Temporary preview build: remove this only when launch SEO settings are approved. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A0532'/%3E%3C/svg%3E">

       libraries are vendored, so no visitor request ever leaves this host (GDPR).
       crossorigin on the preload is REQUIRED even same-origin — fonts always fetch
       in CORS mode, and a preload without it is re-downloaded. -->
  <link rel="preload" as="font" type="font/ttf" href="/assets/fonts/roboto-400.ttf" crossorigin>
  <link rel="stylesheet" href="/css/00-fonts.css">
  <link rel="stylesheet" href="/css/site.css">
  <!-- Lenis is vendored locally; no visitor request leaves this host. -->
  <script defer src="/assets/vendor/lenis.min.js"></script>
{{SCRIPTS}}
</head>
