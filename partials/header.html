<a class="skip-link" href="#main">{{t:skip}}</a>
<header class="site-header" data-site-header>
  <div class="gutter"><div class="container"><div class="site-header__inner">
    <a class="site-logo" href="{{href:/}}" aria-label="{{t:logo.label}}">{{brand:emposo-logo-neu26}}</a>
    <nav class="site-nav max-nav:hidden" aria-label="{{t:nav.label}}">
      <a class="min-h-11" href="{{href:/portfolio/}}"{{CURATTR:portfolio}}>{{t:nav.portfolio}}</a>
      <a class="min-h-11" href="{{href:/branchen/}}"{{CURATTR:branchen}}{{CURATTR:case-studies}}>{{t:nav.branchen}}</a>
      <a class="min-h-11" href="{{href:/about-us/}}"{{CURATTR:about}}>{{t:nav.about}}</a>
      <a class="min-h-11" href="{{href:/karriere/}}"{{CURATTR:karriere}}>{{t:nav.karriere}}</a>
    </nav>
    <a class="header-contact max-nav:hidden min-h-11" href="{{href:/kontakt/}}"{{CURATTR:kontakt}}>{{t:nav.contact}} <span class="header-contact__arrow" aria-hidden="true">→</span></a>
    <details class="mobile-menu nav:hidden" id="mobile-menu">
      <summary aria-label="{{t:menu.open}}" class="min-h-11"><span>{{t:menu}}</span><span aria-hidden="true">+</span></summary>
      <nav class="mobile-menu__panel" aria-label="{{t:nav.label}}">
        <a href="{{href:/portfolio/}}"{{CURATTR:portfolio}}>{{t:nav.portfolio}}</a>
        <a href="{{href:/branchen/}}"{{CURATTR:branchen}}{{CURATTR:case-studies}}>{{t:nav.branchen}}</a>
        <a href="{{href:/about-us/}}"{{CURATTR:about}}>{{t:nav.about}}</a>
        <a href="{{href:/karriere/}}"{{CURATTR:karriere}}>{{t:nav.karriere}}</a>
        <a class="mobile-menu__cta" href="{{href:/kontakt/}}"{{CURATTR:kontakt}}>{{t:nav.contact}} <span class="header-contact__arrow" aria-hidden="true">→</span></a>
      </nav>
    </details>
  </div></div></div>
</header>
