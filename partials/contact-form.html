<form class="contact-form" data-contact-form action="mailto:info@emposo.eu" method="post" enctype="text/plain"><label>{{t:form.name}}<input name="name" aria-describedby="contact-name-support" autocomplete="name" required><span class="contact-form__support" id="contact-name-support"></span></label><label>{{t:form.company}}<input name="company" aria-describedby="contact-company-support" autocomplete="organization"><span class="contact-form__support" id="contact-company-support"></span></label><label>{{t:form.email}}<input name="email" aria-describedby="contact-email-support" type="email" autocomplete="email" required><span class="contact-form__support" id="contact-email-support"></span></label><label class="contact-form__select">{{t:form.interest}}<select name="interest" aria-describedby="contact-interest-support" required><option value="" selected disabled>{{t:form.choose}}</option><option>{{t:form.opt.optimize}}</option><option>{{t:form.opt.transform}}</option><option>{{t:form.opt.scale}}</option><option>{{t:form.opt.career}}</option><option>{{t:form.opt.other}}</option></select><span class="contact-form__support" id="contact-interest-support"></span></label><p class="contact-form__hint" data-contact-hint hidden aria-live="polite"></p><label class="contact-form__message">{{t:form.message}}<textarea name="message" aria-describedby="contact-message-support" rows="4" required></textarea><span class="contact-form__support" id="contact-message-support"></span></label><button type="submit" class="header-contact min-h-11">{{t:form.submit}} <span class="header-contact__arrow" aria-hidden="true">→</span></button><p class="contact-form__explanation">{{t:form.explain}} <a href="{{href:/datenschutzerklaerung/}}">{{t:form.privacy}}</a></p></form>
